name: Verify

on:
  pull_request:
    branches:
      - master
    paths:
      - 'public/qr/**'
      - 'config.toml'

jobs:
  verify:
    runs-on: ubuntu-latest

    steps:
      - name: 🛎 Checkout
        uses: actions/checkout@v7

      - uses: ./.github/workflows/rust-install

      - name: ⚙ Run verifier
        run: cargo run --release -- verify
